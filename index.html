<style>
/* Layout: one narrow column. Edit panel first, then a vertical timeline (times left, stops right) where every stop opens an editor. Rose Quartz and Serenity, flat fills. */
:root {
  --bg: #fbf6f6;
  --surface: #ffffff;
  --fg: #26304a;
  --muted: #6b7390;
  --line: #e7dcdf;
  --rose: #f7cac9;
  --rose-ink: #8a3b44;
  --serenity: #92a8d1;
  --serenity-soft: #e4eaf5;
  --serenity-ink: #34517f;
  --accent: #5f7db3;
  --on-accent: #ffffff;
  --done: #9aa3ba;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171a26;
    --surface: #20243a;
    --fg: #eceef7;
    --muted: #9aa2c0;
    --line: #333852;
    --rose: #5a3a45;
    --rose-ink: #f7cac9;
    --serenity: #92a8d1;
    --serenity-soft: #2a3556;
    --serenity-ink: #b9c9e6;
    --accent: #92a8d1;
    --on-accent: #14213d;
    --done: #6c7491;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171a26;
  --surface: #20243a;
  --fg: #eceef7;
  --muted: #9aa2c0;
  --line: #333852;
  --rose: #5a3a45;
  --rose-ink: #f7cac9;
  --serenity: #92a8d1;
  --serenity-soft: #2a3556;
  --serenity-ink: #b9c9e6;
  --accent: #92a8d1;
  --on-accent: #14213d;
  --done: #6c7491;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

header { display: flex; flex-direction: column; gap: 6px; }
.hrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--rose-ink); }
h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }
.route { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.hform { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }

.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--serenity-soft); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.stat:nth-child(2) { background: var(--rose); }
.stat .k { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--serenity-ink); }
.stat:nth-child(2) .k { color: var(--rose-ink); }
.stat .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat:nth-child(2) .v { color: var(--rose-ink); }

h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* Edit panel */
.tools { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.switch { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; font-weight: 600; cursor: pointer; }
.switch input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.tools-foot { display: flex; gap: 10px; flex-wrap: wrap; }
.verdict { background: var(--serenity-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.verdict strong { font-variant-numeric: tabular-nums; }
.verdict.bad { background: var(--rose); color: var(--rose-ink); }

/* Form controls */
.f { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.f label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.f input[type="text"], .f input[type="time"], .f input[type="number"], .f select {
  font: inherit; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-width: 0; width: 100%;
}
.f input[type="file"] { font: inherit; font-size: 13px; color: var(--muted); width: 100%; min-width: 0; }
.f input:focus-visible, .f select:focus-visible { outline: 3px solid var(--rose); outline-offset: 1px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.span { grid-column: 1 / -1; }

.btn { font: inherit; font-size: 13px; font-weight: 600; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; cursor: pointer; }
.btn.sm { font-size: 12px; padding: 4px 11px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.warn { color: var(--rose-ink); border-color: var(--rose-ink); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }

.progress { display: flex; flex-direction: column; gap: 8px; }
.progress-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--serenity-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }

ol.timeline { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; }
.stop { display: grid; grid-template-columns: 78px 1fr; column-gap: 14px; position: relative; padding-bottom: 20px; }
.stop:last-child { padding-bottom: 0; }
.when { text-align: right; padding-top: 2px; min-width: 0; }
.when .t { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.35; }
.when .alt { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.when.moved .t { color: var(--rose-ink); }
.body { position: relative; padding-left: 22px; min-width: 0; border-left: 2px solid var(--line); padding-bottom: 2px; display: flex; flex-direction: column; gap: 6px; }
.stop:last-child .body { border-left-color: transparent; }
.dot { position: absolute; left: -7px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 3px solid var(--accent); }
.stop.k-food .dot { border-color: var(--rose-ink); }
.stop.k-sight .dot { border-color: var(--serenity); background: var(--serenity); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; gap: 10px; align-items: flex-start; }
.chk { appearance: none; -webkit-appearance: none; flex: none; width: 22px; height: 22px; margin: 1px 0 0; border: 2px solid var(--serenity); border-radius: 7px; background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.chk:checked { background: var(--accent); border-color: var(--accent); }
.chk:checked::after { content: ""; width: 9px; height: 5px; border-left: 2.5px solid var(--surface); border-bottom: 2.5px solid var(--surface); transform: rotate(-45deg) translate(1px, -1px); }
.chk:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
.title { font-weight: 700; font-size: 16px; line-height: 1.3; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 3px 9px; border-radius: 99px; background: var(--serenity-soft); color: var(--serenity-ink); }
.chip.food { background: var(--rose); color: var(--rose-ink); }
.chip.fixed { background: var(--rose); color: var(--rose-ink); }
.fare { margin-left: auto; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.gapnote { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 4px; }
.gapnote.bad { color: var(--rose-ink); background: var(--rose); border-radius: 8px; padding: 4px 10px; align-self: flex-start; }
.stop.done .title { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.stop.done .card { opacity: .72; }

/* Train legs inside a stop */
.lgbox { display: flex; flex-direction: column; gap: 12px; }
.lg { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px dashed var(--line); }
.lg:first-child { border-top: 0; padding-top: 0; }
.lg-top { display: flex; gap: 8px; align-items: flex-end; }
.lg-top .code { width: 64px; flex: none; }
.lg-top .lname { flex: 1; }
.fields { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.fields .f.tm { width: 126px; }
.fields .f.rd { width: 80px; }
.arr { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; padding-bottom: 8px; }
.arr small { font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.lg .gapnote { padding-top: 0; }

.editor { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.lockrow { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; font-weight: 600; cursor: pointer; }
.lockrow input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.lockrow span { color: var(--muted); font-weight: 500; display: block; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }


.addrow { margin-top: 16px; }
body:not(.editing) .edit-only { display: none !important; }
body.editing .view-only { display: none !important; }

/* Photo of a sight, flush with the top of its card */
.photo { margin: -12px -14px 0; position: relative; border-radius: 14px 14px 0 0; overflow: hidden; background: var(--serenity-soft); aspect-ratio: 16 / 9; }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.photo a.credit { position: absolute; right: 8px; bottom: 8px; font-size: 10px; font-weight: 600; color: #fff; background: rgba(20, 24, 40, .55); padding: 2px 8px; border-radius: 99px; text-decoration: none; }
.photo a.credit:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
.stop.done .photo img { filter: grayscale(.6); }

/* Read-only train legs */
.legs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.legs li { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.legs .code { flex: none; min-width: 40px; font-size: 11px; font-weight: 700; color: var(--serenity-ink); background: var(--serenity-soft); border-radius: 6px; padding: 1px 6px; text-align: center; }
.legs .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.legs .tm { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
a.maplink { font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 99px; padding: 3px 11px; white-space: nowrap; align-self: center; }
a.maplink:hover { background: var(--serenity-soft); }
a.maplink:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
.fields a.maplink { margin-bottom: 7px; align-self: flex-end; }

.pane { display: flex; flex-direction: column; gap: 28px; }
.tabs { display: flex; gap: 4px; background: var(--serenity-soft); border-radius: 99px; padding: 4px; align-self: flex-start; }
.tab { font: inherit; font-size: 14px; font-weight: 700; color: var(--serenity-ink); background: none; border: 0; border-radius: 99px; padding: 7px 18px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.tab:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
.summary.two { grid-template-columns: repeat(2, 1fr); }
.publegs { display: flex; flex-direction: column; gap: 6px; }
.publeg { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.publeg .lt { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--fg); }
.pubmsg { white-space: pre-wrap; overflow-wrap: anywhere; font-weight: 600; }

@media (max-width: 420px) {
  h1 { font-size: 28px; }
  .stop { grid-template-columns: 64px 1fr; column-gap: 10px; }
  .stat .v { font-size: 18px; }
  .body { padding-left: 18px; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

      if (!armed) {
        armed = true; v.btnDel.textContent = "Tap again to delete";
        timer = setTimeout(function () { armed = false; v.btnDel.textContent = "Delete stop"; }, 3000);
        return;
      }
      clearTimeout(timer);
      var i = idx();
      cascade(i, -(endOf(s) - startOf(s)));
      data.stops.splice(i, 1);
      delete done[s.id];
      if (openId === s.id) openId = null;
      render();
    });
    return ed;
  }

  function setOpen(id) {
    openId = openId === id ? null : id;
    data.stops.forEach(function (s) {
      var v = views[s.id], on = s.id === openId;
      v.ed.hidden = !on;
      v.editBtn.textContent = on ? "Close" : "Edit";
      v.editBtn.setAttribute("aria-expanded", on ? "true" : "false");
    });
  }

  function addAfter(i) {
    var prev = data.stops[i];
    var st = prev ? endOf(prev) : 9 * 60;
    var s = { id: "s" + (++data.seq), title: "New stop", tag: "Sights", cost: 0, a: st, dur: 30, note: "", photo: "", alt: null, lock: false, legs: null };
    data.stops.splice(i + 1, 0, s);
    cascade(i + 1, 30);
    openId = s.id;
    render();
    setTimeout(function () {
      var t = document.getElementById("e-" + s.id + "-title");
      if (t) { t.focus(); t.select(); if (t.scrollIntoView) t.scrollIntoView({ block: "center" }); }
    }, 0);
  }

  /* ---------- refresh: recompute and update values in place (keeps typing focus) ---------- */
  function refresh() {
    var stops = data.stops, n = stops.length, issues = [];

    stops.forEach(function (s, i) {
      var v = views[s.id]; if (!v) return;
      var st = startOf(s), en = endOf(s);
      v.li.className = "stop k-" + kind(s) + (done[s.id] ? " done" : "");
      v.when.className = "when" + (baseStart[s.id] != null && baseStart[s.id] !== st ? " moved" : "");
      v.t.textContent = en > st ? range(st, en) : fmt(st);
      v.alt.textContent = s.alt != null ? "Alt " + fmt(s.alt) : "";
      v.label.textContent = s.title || "Untitled stop";
      v.cb.checked = !!done[s.id];
      v.cb.setAttribute("aria-label", "Mark done: " + (s.title || "Untitled stop"));

      v.meta.innerHTML = "";
      v.meta.appendChild(el("span", "chip" + (s.tag === "Food" ? " food" : ""), s.tag));
      if (en > st) v.meta.appendChild(el("span", "chip", durTxt(en - st)));
      if (s.lock) v.meta.appendChild(el("span", "chip fixed edit-only", "Fixed time"));
      if (!s.legs) v.meta.appendChild(mapLink(mapUrl(s.title, s.tag), s.tag === "Train" || s.tag === "Bus" ? "Route map" : "Open map"));
      if (s.cost > 0) v.meta.appendChild(el("span", "fare", yen(s.cost)));

      if (s.legs) {
        s.legs.forEach(function (leg, k) {
          var u = v.legUI[k]; if (!u) return;
          setVal(u.code, leg.code); setVal(u.name, leg.name);
          setVal(u.dep, toVal(leg.dep)); setVal(u.ride, leg.ride);
          u.map.href = mapUrl(leg.name, "Train");
          u.arr.innerHTML = "";
          u.arr.appendChild(el("small", null, "Arrives"));
          u.arr.appendChild(document.createTextNode(fmt(leg.dep + leg.ride)));
          if (k < s.legs.length - 1) {
            var nx = s.legs[k + 1], w = nx.dep - (leg.dep + leg.ride);
            u.gap.className = "gapnote" + (w < 0 ? " bad" : "");
            u.gap.textContent = w < 0 ? "The next train leaves " + (-w) + " min before you arrive." : "Transfer wait: " + w + " min";
            if (w < 0) issues.push((nx.name || "A train") + " leaves " + (-w) + " min before the previous train arrives.");
          } else { u.gap.textContent = ""; u.gap.className = "gapnote"; }
        });
      }

      v.note.textContent = s.note; v.note.hidden = !s.note;

      if (s.photo) {
        var useFb = v.failedFor === s.photo && FALLBACK[s.id];
        var src = useFb ? sceneUri(FALLBACK[s.id]) : photoSrc(s.photo);
        if (v.img.getAttribute("src") !== src) { v.photo.hidden = false; v.img.src = src; }
        v.img.alt = s.title || "Photo";
        creditFor(v.credit, useFb ? "scene:" + FALLBACK[s.id] : s.photo);
      } else { v.photo.hidden = true; v.img.removeAttribute("src"); }

      if (v.legList) {
        v.legList.innerHTML = "";
        s.legs.forEach(function (leg) {
          var r = el("li");
          if (leg.code) r.appendChild(el("span", "code", leg.code));
          r.appendChild(el("span", "nm", leg.name));
          r.appendChild(el("span", "tm", range(leg.dep, leg.dep + leg.ride)));
          v.legList.appendChild(r);
        });
      }

      setVal(v.edTitle, s.title); v.edTag.value = s.tag; setVal(v.edCost, s.cost);
      setVal(v.edStart, toVal(st)); setVal(v.edDur, en - st); setVal(v.edEnd, toVal(en));
      setVal(v.edAlt, s.alt != null ? toVal(s.alt) : ""); setVal(v.edNote, s.note); setVal(v.edPhoto, s.photo);
      v.edLock.checked = !!s.lock;
      v.btnUp.disabled = i === 0; v.btnDown.disabled = i === n - 1;

      if (i < n - 1) {
        var nxt = stops[i + 1], g = startOf(nxt) - en;
        if (g < 0) {
          v.gap.className = "gapnote bad";
          v.gap.textContent = "Overlaps the next stop by " + (-g) + " min";
          issues.push((s.title || "A stop") + " ends " + (-g) + " min after " + (nxt.title || "the next stop") + " starts.");
        } else {
          v.gap.className = "gapnote";
          v.gap.textContent = g > 0 ? g + " min free before the next stop" : "Next stop starts right away";
        }
      } else { v.gap.className = "gapnote"; v.gap.textContent = ""; }
    });

    /* summary */
    document.getElementById("h1").textContent = data.title || "Untitled trip";
    document.getElementById("routeTxt").textContent = data.route; document.getElementById("routeTxt").hidden = !data.route;
    var total = stops.reduce(function (a, s) { return a + (s.cost || 0); }, 0);
    document.getElementById("outDoor").textContent = n ? fmt(startOf(stops[0])) : "–";
    document.getElementById("homeBy").textContent = n ? fmt(endOf(stops[n - 1])) : "–";
    document.getElementById("sumTotal").textContent = yen(total);

    var ve = document.getElementById("verdict");
    ve.innerHTML = "";
    if (!n) { ve.className = "verdict"; ve.appendChild(el("span", null, "No stops yet. Add the first one to start planning.")); }
    else if (issues.length) {
      ve.className = "verdict bad";
      ve.appendChild(el("strong", null, issues.length === 1 ? "1 clash to fix" : issues.length + " clashes to fix"));
      issues.forEach(function (t) { ve.appendChild(el("span", null, t)); });
    } else {
      ve.className = "verdict";
      var s1 = el("span"); s1.appendChild(document.createTextNode("No clashes. You are home by ")); s1.appendChild(el("strong", null, fmt(endOf(stops[n - 1])))); s1.appendChild(document.createTextNode("."));
      ve.appendChild(s1);
    }

    /* progress */
    var c = 0; stops.forEach(function (s) { if (done[s.id]) c++; });
    var pct = n ? Math.round(c / n * 100) : 0;
    document.getElementById("progLabel").textContent = c + " of " + n + " stops done";
    document.getElementById("progPct").textContent = pct + "%";
    document.getElementById("progBar").style.width = pct + "%";

    saveAll();
    pubStatus();
  }

  function render() {
    tl.innerHTML = ""; views = {};
    data.stops.forEach(buildStop);
    refresh();
  }

  /* ---------- page controls ---------- */
  var hTitle = document.getElementById("hTitle"), hRoute = document.getElementById("hRoute");
  hTitle.value = data.title; hRoute.value = data.route;
  hTitle.addEventListener("input", function () { data.title = hTitle.value; refresh(); });
  hRoute.addEventListener("input", function () { data.route = hRoute.value; refresh(); });
  document.getElementById("planEdit").addEventListener("click", function () {
    var on = document.body.classList.toggle("editing"), b = document.getElementById("planEdit");
    b.textContent = on ? "Done editing" : "Edit plan";
    b.setAttribute("aria-expanded", on ? "true" : "false");
    b.classList.toggle("pri", on);
    if (!on && openId) setOpen(openId);
  });

  var cas = document.getElementById("cascade");
  cas.checked = data.cascade;
  cas.addEventListener("change", function () { data.cascade = cas.checked; saveAll(); });

  document.getElementById("addTop").addEventListener("click", function () { addAfter(data.stops.length - 1); });
  document.getElementById("addEnd").addEventListener("click", function () { addAfter(data.stops.length - 1); });

  var pr = document.getElementById("planReset"), prArmed = false, prTimer = null;
  pr.addEventListener("click", function () {
    if (!prArmed) {
      prArmed = true; pr.textContent = "Tap again to replace your edits";
      prTimer = setTimeout(function () { prArmed = false; pr.textContent = "Back to original plan"; }, 3000);
      return;
    }
    clearTimeout(prTimer); prArmed = false; pr.textContent = "Back to original plan";
    data = defaults(); openId = null;
    hTitle.value = data.title; hRoute.value = data.route; cas.checked = data.cascade;
    render();
  });

  document.getElementById("reset").addEventListener("click", function () { done = {}; saveAll(); refresh(); });

  /* ---------- Everyone tab: Firebase Realtime Database ---------- */
  var cfg = window.NIKKO_CONFIG || {}, fbCfg = cfg.firebase || {}, PATH = cfg.path || "itinerary";
  var configured = !!(fbCfg.apiKey && !/^PASTE/i.test(fbCfg.apiKey) && /^https:\/\//.test(fbCfg.databaseURL || ""));
  var hadLocal = false; try { hadLocal = !!localStorage.getItem(KEY); } catch (e) {}
  var tabsEl = document.getElementById("tabs"), tabMe = document.getElementById("tabMe"), tabAll = document.getElementById("tabAll");
  var mePane = document.getElementById("mePane"), allPane = document.getElementById("allPane");
  var pubMsg = document.getElementById("pubMsg"), pubName = document.getElementById("pubName");
  var pubStatusEl = document.getElementById("pubStatus"), pubBtn = document.getElementById("pubBtn"), loadBtn = document.getElementById("loadBtn"), pubView = document.getElementById("pubView");
  var db = null, pub = null, pubState = configured ? "loading" : "setup", pubBusy = false, pubErr = "", msgTouched = false, adopted = false;
  try { pubName.value = localStorage.getItem("nikko-day-trip-name") || ""; } catch (e) {}

  function twoTap(btn, idle, armedText, fn) {
    var armed = false, t = null;
    btn.addEventListener("click", function () {
      if (!armed) { armed = true; btn.textContent = armedText; t = setTimeout(function () { armed = false; btn.textContent = idle; }, 3000); return; }
      clearTimeout(t); armed = false; btn.textContent = idle; fn();
    });
  }
  /* The Realtime Database drops empty values and turns arrays into objects, and what it returns is other people's input: check every field. */
  function arr(x) {
    if (Array.isArray(x)) return x.filter(function (v) { return v != null; });
    if (x && typeof x === "object") return Object.keys(x).sort(function (p, q) { return (+p) - (+q); }).map(function (k) { return x[k]; });
    return [];
  }
  function str(x, n) { return String(x == null ? "" : x).slice(0, n); }
  function cleanPub(raw) {
    if (!raw || typeof raw !== "object") return null;
    var out = { title: str(raw.title, 120), route: str(raw.route, 300), message: str(raw.message, 300), at: str(raw.publishedAt, 40), by: str(raw.by, 60), stops: [] };
    var seen = {};
    arr(raw.stops).slice(0, 60).forEach(function (st, i) {
      if (!st || !num(st.a) || !num(st.dur)) return;
      var id = str(st.id, 20).replace(/[^A-Za-z0-9_-]/g, "") || "x" + i;
      if (seen[id]) id += "_" + i; seen[id] = 1;
      var legs = arr(st.legs).filter(function (l) { return l && num(l.dep) && num(l.ride); }).slice(0, 12).map(function (l) {
        return { code: str(l.code, 6), name: str(l.name, 120), dep: l.dep, ride: Math.max(1, l.ride) };
      });
      var s = { id: id, title: str(st.title, 200), tag: TAGS.indexOf(st.tag) >= 0 ? st.tag : "Other", cost: num(st.cost) && st.cost >= 0 ? st.cost : 0,
        a: st.a, dur: Math.max(0, st.dur), note: str(st.note, 500), photo: str(st.photo, 600), alt: num(st.alt) ? st.alt : null, lock: !!st.lock, legs: legs.length ? legs : null };
      sync(s); out.stops.push(s);
    });
    return out;
  }
  function snapshot(msg) {
    return { title: data.title || "", route: data.route || "", message: msg, stops: data.stops.map(function (s) {
      return { id: s.id, title: s.title || "", tag: s.tag, cost: s.cost || 0, a: startOf(s), dur: endOf(s) - startOf(s), note: s.note || "", photo: s.photo || "",
        alt: s.alt == null ? null : s.alt, lock: !!s.lock,
        legs: s.legs ? s.legs.map(function (l) { return { code: l.code || "", name: l.name || "", dep: l.dep, ride: l.ride }; }) : null };
    }) };
  }
  function keyOf(c) {
    return JSON.stringify([c.title, c.route, c.message, c.stops.map(function (s) {
      return [s.id, s.title, s.tag, s.cost, s.a, s.dur, s.note, s.photo, s.alt, s.lock, s.legs ? s.legs.map(function (l) { return [l.code, l.name, l.dep, l.ride]; }) : null];
    })]);
  }
  /* Copy the shared plan into this person's Only me draft. */
  function adoptShared() {
    if (!pub) return;
    data.title = pub.title || data.title; data.route = pub.route;
    data.stops = JSON.parse(JSON.stringify(pub.stops));
    var mx = 0; data.stops.forEach(function (s) { var m = /^s(\d+)$/.exec(s.id); if (m) mx = Math.max(mx, +m[1]); });
    data.seq = Math.max(mx, data.stops.length, data.seq || 0);
    openId = null; hTitle.value = data.title; hRoute.value = data.route;
    render();
  }

  function renderPub() {
    pubView.innerHTML = "";
    if (pubState !== "ready" || !pub) {
      var msgs = {
        loading: "Loading the shared itinerary…",
        setup: "Sharing is not set up yet. The person who hosts this page needs to paste their Firebase details at the top of index.html.",
        empty: "Nothing has been shared yet. Open Only me, plan the day and press Publish to everyone.",
        error: "The shared itinerary did not load. Check your connection and reload the page."
      };
      pubView.appendChild(el("div", "verdict", msgs[pubState] || msgs.error));
      return;
    }
    var hd = el("header");
    hd.appendChild(el("div", "eyebrow", "Shared itinerary"));
    hd.appendChild(el("h1", null, pub.title || "Day trip"));
    if (pub.route) hd.appendChild(el("div", "route", pub.route));
    var when = pub.at ? new Date(pub.at) : null, line = "";
    if (when && !isNaN(when.getTime())) line = "Updated " + when.toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    if (pub.by) line += (line ? " by " : "Shared by ") + pub.by;
    if (line) hd.appendChild(el("div", "route", line));
    var eb = el("button", "btn sm", "Edit this plan in Only me"); eb.type = "button"; eb.style.alignSelf = "flex-start";
    twoTap(eb, "Edit this plan in Only me", "Tap again to replace your Only me draft", function () { adoptShared(); pickTab("me"); });
    hd.appendChild(eb);
    pubView.appendChild(hd);

    if (pub.message) pubView.appendChild(el("div", "verdict pubmsg", pub.message));

    var n = pub.stops.length;
    if (!n) { pubView.appendChild(el("div", "verdict", "No stops have been shared yet.")); return; }
    var sm = el("section", "summary two");
    var a = el("div", "stat"); a.appendChild(el("div", "k", "Starts")); a.appendChild(el("div", "v", fmt(startOf(pub.stops[0]))));
    var b = el("div", "stat"); b.appendChild(el("div", "k", "Home by")); b.appendChild(el("div", "v", fmt(endOf(pub.stops[n - 1]))));
    sm.appendChild(a); sm.appendChild(b); pubView.appendChild(sm);

    var sec = el("section"); sec.appendChild(el("h2", null, "The day"));
    var ol = el("ol", "timeline");
    pub.stops.forEach(function (s) {
      var st = startOf(s), en = endOf(s);
      var li = el("li", "stop k-" + kind(s));
      var wh = el("div", "when"); wh.appendChild(el("div", "t", en > st ? range(st, en) : fmt(st))); li.appendChild(wh);
      var body = el("div", "body"); body.appendChild(el("span", "dot"));
      var card = el("div", "card");
      if (s.photo) card.appendChild(photoFigure(s.photo, s.title, FALLBACK[s.id]));
      card.appendChild(el("div", "title", s.title || "Untitled stop"));
      var meta = el("div", "meta");
      meta.appendChild(el("span", "chip" + (s.tag === "Food" ? " food" : ""), s.tag));
      if (en > st) meta.appendChild(el("span", "chip", durTxt(en - st)));
      if (!s.legs) meta.appendChild(mapLink(mapUrl(s.title, s.tag), s.tag === "Train" || s.tag === "Bus" ? "Route map" : "Open map"));
      card.appendChild(meta);
      if (s.legs) {
        var lg = el("div", "publegs");
        s.legs.forEach(function (l) {
          var r = el("div", "publeg");
          if (l.code) r.appendChild(el("span", "chip" + (l.code === "Tobu" ? " food" : ""), l.code));
          r.appendChild(el("span", null, l.name));
          r.appendChild(mapLink(mapUrl(l.name, "Train")));
          r.appendChild(el("span", "lt", fmt(l.dep) + " → " + fmt(l.dep + l.ride)));
          lg.appendChild(r);
        });
        card.appendChild(lg);
      }
      if (s.note) card.appendChild(el("p", "note", s.note));
      body.appendChild(card); li.appendChild(body); ol.appendChild(li);
    });
    sec.appendChild(ol); pubView.appendChild(sec);
  }

  function pubStatus() {
    if (!pubBtn) return;
    var same = pubState === "ready" && !!pub && keyOf(pub) === keyOf(snapshot(pubMsg.value.trim()));
    var text, bad = false;
    if (pubBusy) text = "Publishing…";
    else if (pubErr) { text = pubErr; bad = true; }
    else if (pubState === "setup") { text = "Sharing is not set up yet. Paste your Firebase details at the top of index.html."; bad = true; }
    else if (pubState === "error") { text = "The shared itinerary did not load. Reload the page to try again."; bad = true; }
    else if (pubState === "loading") text = "Connecting…";
    else if (pubState === "empty") text = "Nothing is shared yet. The Everyone tab stays empty until someone publishes.";
    else if (same) text = "Your plan matches what everyone sees.";
    else { text = "Your plan is different from what everyone sees. Press Publish to everyone to replace it."; bad = true; }
    pubStatusEl.className = "verdict" + (bad ? " bad" : "");
    pubStatusEl.textContent = text;
    pubBtn.disabled = pubBusy || !db || same;
    loadBtn.disabled = !pub || same;
  }
  pubMsg.addEventListener("input", function () { msgTouched = true; pubErr = ""; pubStatus(); });
  pubName.addEventListener("input", function () { try { localStorage.setItem("nikko-day-trip-name", pubName.value); } catch (e) {} });
  twoTap(loadBtn, "Start from the shared plan", "Tap again to replace your draft", function () { adoptShared(); });
  pubBtn.addEventListener("click", function () {
    if (!db || pubBusy) return;
    var doc = snapshot(pubMsg.value.trim());
    doc.publishedAt = new Date().toISOString(); doc.by = pubName.value.trim().slice(0, 60);
    var up = {}, key = db.ref("history").push().key;
    up[PATH] = doc; up["history/" + key] = doc;
    pubBusy = true; pubErr = ""; pubStatus();
    var slow = setTimeout(function () {
      if (pubBusy) { pubBusy = false; pubErr = "Still waiting for a connection. Your update will go out when you are back online."; pubStatus(); }
    }, 12000);
    db.ref().update(up).then(function () { clearTimeout(slow); pubBusy = false; pubErr = ""; pubStatus(); })
      .catch(function () { clearTimeout(slow); pubBusy = false; pubErr = "Publishing did not go through. Check your connection and try again."; pubStatus(); });
  });

  function showTab(which) {
    var me = which === "me";
    mePane.hidden = !me; allPane.hidden = me;
    tabMe.setAttribute("aria-selected", me ? "true" : "false");
    tabAll.setAttribute("aria-selected", me ? "false" : "true");
  }
  function tabFromHash() {
    var h = ""; try { h = location.hash; } catch (e) {}
    if (h === "#only-me") return "me";
    if (h === "#everyone") return "all";
    return configured ? "all" : "me";
  }
  function pickTab(which) { showTab(which); try { location.hash = which === "me" ? "only-me" : "everyone"; } catch (e) {} }
  tabMe.addEventListener("click", function () { pickTab("me"); });
  tabAll.addEventListener("click", function () { pickTab("all"); });
  window.addEventListener("hashchange", function () { showTab(tabFromHash()); });

  function startFirebase() {
    try {
      if (!window.firebase) throw new Error("The Firebase library did not load.");
      firebase.initializeApp(fbCfg); db = firebase.database();
    } catch (e) { pubState = "error"; renderPub(); pubStatus(); return; }
    db.ref(PATH).on("value", function (snap) {
      var cl = snap.exists() ? cleanPub(snap.val()) : null;
      pub = cl; pubState = cl ? "ready" : "empty";
      /* A first-time visitor starts from whatever is shared. Only the very first snapshot does this, so a draft is never replaced later. */
      if (!adopted) { adopted = true; if (cl && !hadLocal) adoptShared(); }
      if (cl && !msgTouched && document.activeElement !== pubMsg) pubMsg.value = cl.message;
      renderPub(); pubStatus();
    }, function () { pubState = "error"; renderPub(); pubStatus(); });
  }

  render();
  renderPub();
  showTab(tabFromHash());
  if (configured) startFirebase(); else pubStatus();
})();
</script>
</body>
